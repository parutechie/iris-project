services:

  postgres:

    # imresamu/postgis provides multi-arch builds including
    # linux/arm64 (Apple Silicon M1/M2/M3).
    # The official postgis/postgis image does not have arm64.
    image: imresamu/postgis:17-3.5

    container_name: nrw-postgis

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:

    # dpage/pgadmin4 supports arm64 natively from v7+
    image: dpage/pgadmin4:latest

    container_name: nrw-pgadmin

    restart: unless-stopped

    platform: linux/amd64

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

volumes:

  postgres_data:
